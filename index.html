.card {

.profile-pic {
width: 140px;
height: 140px;
border-radius: 50%;
border: 4px solid #d4af37;
box-shadow: 0 0 25px rgba(212,175,55,0.6);
}

.links {
margin-top: 30px;
}

.link-box {
position: relative;
display: block;
margin: 15px auto;
width: 85%;
max-width: 320px;
padding: 18px;
border-radius: 50px;
text-decoration: none;
color: #d4af37;
font-weight: bold;
background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
border: 1px solid #d4af37;
box-shadow:
inset 0 0 10px rgba(212,175,55,0.2),
0 0 15px rgba(212,175,55,0.3);
transition: 0.3s;
overflow: hidden;
}

.link-box::before {
content: "";
position: absolute;
top: 0;
left: -100%;
width: 60%;
height: 100%;
background: linear-gradient(120deg, transparent, rgba(212,175,55,0.4), transparent);
transition: 0.5s;
}

/* hover */
.link-box:hover::before {
left: 120%;
}

.link-box:hover {
transform: scale(1.05);
box-shadow:
0 0 25px rgba(212,175,55,0.6),
inset 0 0 10px rgba(212,175,55,0.3);
}

.link-box i {
margin-left: 10px;
font-size: 18px;
}

.footer-box {
margin-top: 40px;
padding: 15px;
border-radius: 20px;
background: #000;
border: 1px solid #d4af37;
color: #d4af37;
box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

.footer-box span {
color: #fff;
}

/* شكل الساعة */
.watch {
width: 180px;
height: 180px;
border: 4px solid #d4af37;
border-radius: 50%;
margin: 20px auto;
position: relative;
box-shadow: 0 0 25px rgba(212,175,55,0.5),
inset 0 0 15px rgba(212,175,55,0.2);
}

/* نقط الساعات */
.watch::before {
content: "";
position: absolute;
width: 100%;
height: 100%;
border-radius: 50%;
background: radial-gradient(circle, transparent 70%, rgba(212,175,55,0.2));
}

/* العقارب */
.hand {
position: absolute;
bottom: 50%;
left: 50%;
transform-origin: bottom;
transform: translateX(-50%);
border-radius: 5px;
}

/* عقرب الساعة */
.hour {
width: 6px;
height: 40px;
background: #d4af37;
animation: rotateHour 12s linear infinite;
}

/* عقرب الدقايق */
.minute {
width: 4px;
height: 60px;
background: #fff;
animation: rotateMinute 6s linear infinite;
}

/* عقرب الثواني */
.second {
width: 2px;
height: 70px;
background: red;
animation: rotateSecond 3s linear infinite;
}

/* أنيميشن */
@keyframes rotateHour {
from { transform: translateX(-50%) rotate(0deg); }
to { transform: translateX(-50%) rotate(360deg); }
}

@keyframes rotateMinute {
from { transform: translateX(-50%) rotate(0deg); }
to { transform: translateX(-50%) rotate(360deg); }
}

@keyframes rotateSecond {
from { transform: translateX(-50%) rotate(0deg); }
to { transform: translateX(-50%) rotate(360deg); }
}

</style>
